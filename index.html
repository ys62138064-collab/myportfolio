<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>鄭雨絲 · 粉系VR展廳 · 臥遊</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', '華文細黑', 'Microsoft YaHei', sans-serif;
      background: #fce9e6;
    }
    #info {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #4a3f4a;
      font-size: 14px;
      letter-spacing: 2px;
      background: rgba(255, 240, 235, 0.6);
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      width: fit-content;
      margin: 0 auto;
      border-radius: 60px;
      border: 1px solid rgba(200, 150, 160, 0.25);
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 6px rgba(255, 220, 210, 0.3);
      box-shadow: 0 4px 20px rgba(180, 100, 120, 0.1);
    }
    #info span { opacity: 0.7; font-weight: 300; }
    @media (max-width: 600px) { #info { font-size: 11px; padding: 4px 14px; bottom: 12px; } }

    #loading {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #fce9e6;
      display: flex; align-items: center; justify-content: center;
      color: #7a5a62; font-size: 20px; letter-spacing: 6px;
      z-index: 999; transition: opacity 0.8s ease;
      pointer-events: none; font-weight: 300;
      text-shadow: 0 2px 12px rgba(200, 120, 140, 0.2);
    }
    #loading.hide { opacity: 0; }

    /* ===== 作品詳情彈窗 (臥遊) ===== */
    #detail-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(20, 15, 18, 0.75);
      backdrop-filter: blur(14px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      animation: fadeIn 0.4s ease;
      padding: 20px;
    }
    #detail-overlay.active { display: flex; }
    #detail-box {
      background: rgba(255, 245, 240, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      max-width: 1100px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      padding: 28px 30px 30px 30px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255, 215, 200, 0.2);
      position: relative;
      border: 1px solid rgba(255, 220, 210, 0.3);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    #detail-close {
      position: sticky;
      top: 0;
      align-self: flex-end;
      background: rgba(60, 40, 45, 0.15);
      backdrop-filter: blur(4px);
      border: none;
      color: #4a3a3e;
      font-size: 28px;
      width: 48px; height: 48px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(200, 150, 160, 0.2);
      flex-shrink: 0;
      margin-bottom: 4px;
      z-index: 5;
    }
    #detail-close:hover { background: rgba(80, 50, 55, 0.25); transform: scale(1.05); }

    #detail-content {
      display: flex;
      flex-direction: row;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #detail-image-area {
      flex: 1 1 400px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #detail-main-img {
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      background: #1a1418;
      object-fit: contain;
      max-height: 450px;
      border: 1px solid rgba(255, 215, 200, 0.15);
      cursor: zoom-in;
      transition: transform 0.2s;
    }
    #detail-main-img:active { transform: scale(0.98); }
    #detail-thumbs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .thumb-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      background: #e8d0ca;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .thumb-img:hover { border-color: #b08a82; transform: scale(1.04); }
    .thumb-img.active { border-color: #a06a62; box-shadow: 0 0 0 2px #cfa8a0; }

    #detail-text {
      flex: 1 1 320px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: #3d2e30;
    }
    #detail-text h2 {
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 3px;
      color: #3d2e30;
      border-bottom: 2px solid rgba(200, 150, 160, 0.2);
      padding-bottom: 8px;
    }
    #detail-text .sub {
      font-size: 14px;
      color: #6f5558;
      letter-spacing: 1px;
      margin-top: -4px;
    }
    #detail-text .concept {
      font-size: 15px;
      line-height: 1.8;
      color: #3d2e30;
      background: rgba(255, 235, 230, 0.4);
      padding: 14px 18px;
      border-radius: 16px;
      border-left: 3px solid #dbb8b0;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #detail-text .concept::-webkit-scrollbar { width: 4px; }
    #detail-text .concept::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 8px; }
    #detail-text .concept::-webkit-scrollbar-thumb { background: #cfa8a0; border-radius: 8px; }

    .detail-footer {
      font-size: 12px;
      color: #8a7276;
      text-align: right;
      border-top: 1px solid rgba(200, 150, 160, 0.15);
      padding-top: 12px;
      margin-top: 4px;
    }

    @media (max-width: 700px) {
      #detail-box { padding: 18px 16px; max-height: 96vh; }
      #detail-content { flex-direction: column; gap: 16px; }
      #detail-main-img { max-height: 300px; }
      #detail-text h2 { font-size: 22px; }
      .thumb-img { width: 56px; height: 56px; }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .click-hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #7a5a62;
      background: rgba(255, 235, 230, 0.6);
      backdrop-filter: blur(4px);
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 13px;
      letter-spacing: 2px;
      border: 1px solid rgba(200, 150, 160, 0.2);
      pointer-events: none;
      z-index: 10;
      opacity: 0.8;
      white-space: nowrap;
    }
    @media (max-width: 600px) { .click-hint { bottom: 70px; font-size: 11px; padding: 4px 14px; } }
  </style>
</head>
<body>
  <div id="loading">✦ 載入藝術空間 ✦</div>
  <div id="info">🖱️ 拖拽旋轉 · 滾輪縮放 · 點擊畫作臥遊 🏞️ <span>「 鄭雨絲 · 粉系VR 」</span></div>
  <div class="click-hint">🖱️ 點擊畫作 · 臥遊細節</div>

  <!-- 詳情彈窗 -->
  <div id="detail-overlay">
    <div id="detail-box">
      <button id="detail-close">✕</button>
      <div id="detail-content">
        <div id="detail-image-area">
          <img id="detail-main-img" src="" alt="作品主圖">
          <div id="detail-thumbs"></div>
        </div>
        <div id="detail-text">
          <h2 id="detail-title">作品名</h2>
          <div class="sub" id="detail-sub">尺寸 · 年份</div>
          <div class="concept" id="detail-concept">創作理念載入中...</div>
          <div class="detail-footer">🖱️ 點擊主圖可縮放 · 縮略圖切換局部</div>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- DOM refs ---
    const detailOverlay = document.getElementById('detail-overlay');
    const detailClose = document.getElementById('detail-close');
    const detailMainImg = document.getElementById('detail-main-img');
    const detailTitle = document.getElementById('detail-title');
    const detailSub = document.getElementById('detail-sub');
    const detailConcept = document.getElementById('detail-concept');
    const detailThumbs = document.getElementById('detail-thumbs');

    // --- 1. 場景 ---
    const scene = new THREE.Scene();
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, '#fad9d5');
    gradient.addColorStop(0.4, '#f8cfcf');
    gradient.addColorStop(0.7, '#f0c0c4');
    gradient.addColorStop(1, '#e8b4b8');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    scene.background = new THREE.CanvasTexture(canvas);
    scene.fog = new THREE.FogExp2(0xf0d0ce, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.2, 11);
    camera.lookAt(0, 0.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    // --- 2. 控制器 ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.6;
    controls.zoomSpeed = 0.8;
    controls.panSpeed = 0.4;
    controls.screenSpacePanning = true;
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 2.5;
    controls.maxDistance = 18;
    controls.target.set(0, 0.6, 0);

    // --- 3. 燈光 ---
    const ambientLight = new THREE.AmbientLight(0xffd9d0, 0.7);
    scene.add(ambientLight);
    const mainLight = new THREE.DirectionalLight(0xffe0dd, 1.0);
    mainLight.position.set(3, 6, 6);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);
    const backLight = new THREE.DirectionalLight(0xffccdd, 0.6);
    backLight.position.set(-3, 2, -6);
    scene.add(backLight);
    const fillLight = new THREE.PointLight(0xffb0aa, 0.5);
    fillLight.position.set(0, 3, 4);
    scene.add(fillLight);
    const bottomLight = new THREE.PointLight(0xffaa99, 0.3);
    bottomLight.position.set(0, -2, 2);
    scene.add(bottomLight);

    // --- 4. 地面 ---
    const floorGeometry = new THREE.CircleGeometry(8, 32);
    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0xf2d6d0,
      roughness: 0.9,
      metalness: 0.0,
      transparent: true,
      opacity: 0.25,
      side: THREE.DoubleSide
    });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.6;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(12, 12, 0xccb0b0, 0xbb9a9a);
    gridHelper.position.y = -0.55;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.12;
    scene.add(gridHelper);

    // 粒子
    const particleCount = 350;
    const particlesGeo = new THREE.BufferGeometry();
    const particlesPos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      particlesPos[i] = (Math.random() - 0.5) * 28;
      particlesPos[i+1] = (Math.random() - 0.5) * 14;
      particlesPos[i+2] = (Math.random() - 0.5) * 20 - 4;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPos, 3));
    const particlesMat = new THREE.PointsMaterial({
      color: 0xdbb0b0,
      size: 0.05,
      transparent: true,
      opacity: 0.3,
      blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particles);

    // --- 5. 畫作數據 (從原始HTML提取，保留繁體內容) ---
    const artworks = [
      { img: '图片1.jpg', title: '悠然自得', desc: '2025 · 宣紙 38x38cm', concept: '北宋王希孟的千里江山圖，綿延不絕的山峰，層次分明的色彩結構，甚是讓人心曠神怡。因而將其重巒疊嶂的山峰和明豔夏日色彩，融入自己的想像，將峰巒嵌入茶杯中，通過清晰的山水景色，傳遞悠然自得的感受。在繁華喧囂的城市之中，給予自己一片靜謐而舒適的淨土，療愈心靈。' },
      { img: '图片2.jpg', title: '鏡中蜃樓', desc: '2025 · 卷軸 42x79cm', concept: '童年時時常聽家裏長輩娓娓道來建築之宏偉，結構之複雜。因而便將建築融入鏡中花的想像之中，採用夏日輕盈、治癒系的柔和色調，展現「美」的內涵。繪畫時，常冥想如果鏡框裏的建築頂層有美麗的山水景色，能讓在喧囂的繁華都市裏生存的人呼吸到新鮮的空氣，欣賞大自然的山水，並從中尋找平靜，享受大自然的包圍感，在這片喧嚷的土地中找到一片屬於自己的淨土。' },
      { img: '图片3.jpg', title: '香飄四溢', desc: '2025 · 宣紙 38x38cm', concept: '每逢炎炎夏日，香港人總是喜歡捧著香飄四溢的奶茶欣賞著維港美麗的海景，拂面而來的海風撫平了因塵世紛擾的煩躁心情。而在深圳東門老街的夏天，是活力與煙火氣的縮影。購物與美食讓人沉浸在都市熱鬧的畫卷裏。無論是柔和愜意的海風還是霓虹閃爍的畫卷，都讓人卸下了疲憊的生活步伐。' },
      { img: '图片4.jpg', title: '懶惰貓貓', desc: '2025 · 42x29.7cm', concept: '寵物是人類的好朋友，在面對生活的煩惱時，與善良貓咪的接觸，可以安撫緩解我們的緊張情緒。它有著明亮的眼睛和毛茸茸的身體，天生可愛討喜，舉止優雅。世人皆愛乖巧、溫馴的貓貓，就像是文人寵愛貓貓，是因為它陪伴在身邊，似一位佳人在身旁紅袖添香，讓人神清氣爽。' },
      { img: '图片5.jpg', title: '旋轉木馬', desc: '2025 · 卷軸 80x31cm', concept: '有時夜間臥枕時，腦海裏的記憶晶片會回撥童年時某個瞬間：小時候常與家人在遊樂場遊玩旋轉木馬，那時的無憂無慮，遠是現實的物質無法比擬的。白駒過隙，再憶往昔時，歡聲笑語時常環繞耳畔。童年裏純真美好溫暖的童話，一直寄存於旋轉木馬的歡笑之中。' },
      { img: '图片6.jpg', title: '丹頂鶴壽', desc: '2025 · 宣紙 33x28cm', concept: '丹頂鶴有長壽、吉祥、忠貞、高潔的品德，被稱為仙鶴。繪作此畫是將祈願藏於禮物盒中，希望家中長輩，在未來漫長的歲月蹉跎中能夠長壽無疆，遠離病痛糾纏， 歲歲平安、齒德俱尊、福祿延綿、福泰安康。' },
      { img: '图片7.jpg', title: '魚躍團圓', desc: '2025 · 宣紙 36.5x27cm', concept: '中秋佳節是闔家團圓的喜慶之日。每逢佳節，馬鞍山體育場旁邊的恒安邨總會掛滿燈籠，而我的瞳孔總是聚焦於雀躍的小魚燈身上，心中便祈願“年年有魚，順遂無虞”。' },
      { img: '图片8.jpg', title: '梔子錦簇', desc: '2025 · 宣紙 33.5x27.5cm', concept: '梔子花象徵純潔與優雅、永恆的愛與約定，一生守候與堅持，同時也有喜悅的寓意。甚是欣賞梔子的堅韌與深情。因此，便把梔子繪於古扇中，記念梔子花的忠貞。' },
      { img: '图片9.jpg', title: '鳳冠霞帔', desc: '2025 · 宣紙 42x29.7cm', concept: '古代後妃及誥命夫人的禮服，由飾有鳳凰的帽子和美如雲霞的披肩組成，以示身份尊貴，榮耀顯赫。在現代，鳳冠霞帔逐漸演變成了傳統中式婚禮的標配，象徵著喜慶、祝福和身份。同時也是一種女性自我價值的美學表達、傳統文化復興的載體。畫作將傳統的古代服飾和夏日的繽紛色彩結合在一起，現展出高雅、恬靜的古今韻味。' },
      { img: '图片10.jpg', title: '聘婷嫋娜·女冠', desc: '2025 · 卷軸 34x80cm', concept: '女冠是指中國古代婦女的貴重禮冠。它通常分為兩種主要應用場景：一是古代後妃、命婦在重大典禮時所佩戴的頭飾；二是舊時平民女子在婚禮上搭配「霞帔」使用的豪華頭飾。畫作將古代的傳統飾物與現代夏日明亮的暖色系相融合，表達了古代女子對於美麗繁華的嚮往，也是對古韻美的一種精神寄託。' },
      { img: '图片11.jpg', title: '玉簪', desc: '2025 · 宣紙 38x38cm', concept: '玉簪子選用玉石為原料，玉在傳統文化中象徵著美德與君子之風，在《禮記》亦有中記載：“君子比德於玉，溫潤而澤仁也。”‌玉石在文化中享有崇高的地位，代表高雅、純潔、堅貞不渝。古人認為，佩戴玉簪子可驅邪、祈福、平安，為佩戴者帶來好運。' },
      { img: '图片12.jpg', title: '清馬騰飛', desc: '2025 · 宣紙 38x38cm', concept: '在姑姑年輕時的畫作畢業展覽中，見到了一隻駿馬騰雲駕霧，十分輕盈俊美。她細膩的筆觸引起了我對馬兒的喜愛，便將現代版的獨角獸與細膩的工筆相結合；採用如代碼邏輯版精密的線條鋪排；結合淡淡的湖水淡蓝色和深色系的夜空色彩，展現出馬兒的美韻和自由，寓意一生清明澄澈，心性純良。' },
      { img: '图片13.jpg', title: '鄭雨絲 · 藝術家', desc: '暨南大學 · 港大進修 · 教大研究生', concept: '2023年畢業於暨南大學本科，2024年在香港大學專業進修學院修讀設計課程，2026入讀香港教育大學研究生。現生活於香港並從事藝術教育工作，曾獲得倫敦英國繪畫比賽獎項，畫作曾在英國倫敦與香港展出。曾被深圳萬達廣場邀請個展「山有扶蘇，隰有荷華」個展 。擅長運用工筆繪畫生活中的靜物、所見所聞及研究古代仕女，在傳統風格裏面加入一些現代元素，賦予其美好的思想感情。用細膩的線條勾勒出物體的整體輪廓，用墨水暈染出不同的層次感和厚度，用色彩賦予其情感的完美釋放。最後將美融於畫作事物之中，以水墨的方式彰顯「美學」韻味，塑造出富有現代人性的畫面感，又能產生一種恬靜淡雅，又不失風韻的現代水墨畫作。' }
    ];

    const cardMeshes = [];
    const radius = 5.6;
    const startAngle = -1.2;
    const angleStep = (2.4) / (artworks.length - 1);
    const cardDataMap = new Map();

    // 生成局部縮略圖 (模擬不同局部，實際可替換為真實局部圖)
    function generateThumbUrls(baseImg) {
      return [
        baseImg + '?v=1',
        baseImg + '?v=2',
        baseImg + '?v=3'
      ];
    }

    artworks.forEach((item, index) => {
      const angle = startAngle + index * angleStep;
      const x = Math.sin(angle) * radius;
      const z = Math.cos(angle) * radius - 1.5;
      const y = 0.2 + Math.sin(angle * 1.5) * 0.3;

      const frameWidth = 1.9;
      const frameHeight = 2.1;
      const depth = 0.12;

      // 畫板
      const canvasMat = new THREE.MeshStandardMaterial({
        color: 0xf5e0dc,
        roughness: 0.5,
        metalness: 0.05,
        side: THREE.DoubleSide
      });
      const canvasGeo = new THREE.BoxGeometry(frameWidth, frameHeight, depth);
      const canvas = new THREE.Mesh(canvasGeo, canvasMat);
      canvas.castShadow = true;
      canvas.receiveShadow = true;
      canvas.position.set(x, y, z);

      // 圖片紋理
      const textureLoader = new THREE.TextureLoader();
      const placeholderMat = new THREE.MeshStandardMaterial({
        color: 0xe8d0ca,
        roughness: 0.6,
        metalness: 0.05,
      });
      const imgMesh = new THREE.Mesh(new THREE.PlaneGeometry(frameWidth * 0.85, frameHeight * 0.85), placeholderMat);
      imgMesh.position.set(x, y, z + depth/2 + 0.005);
      imgMesh.castShadow = false;
      imgMesh.receiveShadow = false;

      textureLoader.load(item.img, (texture) => {
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        imgMesh.material = new THREE.MeshStandardMaterial({
          map: texture,
          roughness: 0.3,
          metalness: 0.02,
          side: THREE.DoubleSide,
        });
        imgMesh.material.needsUpdate = true;
      }, undefined, () => {
        imgMesh.material.color.setHex(0xdbb8b0);
      });

      scene.add(canvas);
      scene.add(imgMesh);

      // 邊框
      const edgeMat = new THREE.MeshStandardMaterial({
        color: 0xe8c8c0,
        emissive: 0xccaaa0,
        roughness: 0.3,
        metalness: 0.4,
        transparent: true,
        opacity: 0.25
      });
      const edgeGeo = new THREE.BoxGeometry(frameWidth + 0.08, frameHeight + 0.08, 0.04);
      const edge = new THREE.Mesh(edgeGeo, edgeMat);
      edge.position.set(x, y, z + depth/2 + 0.02);
      scene.add(edge);

      // 標籤 (CSS2D)
      const labelDiv = document.createElement('div');
      labelDiv.style.color = '#5a3f42';
      labelDiv.style.fontFamily = '"Segoe UI", "華文細黑", sans-serif';
      labelDiv.style.textAlign = 'center';
      labelDiv.style.textShadow = '0 2px 20px rgba(255,220,210,0.5), 0 0 12px rgba(255,200,190,0.3)';
      labelDiv.style.background = 'rgba(255, 240, 235, 0.5)';
      labelDiv.style.backdropFilter = 'blur(6px)';
      labelDiv.style.padding = '5px 14px 7px 14px';
      labelDiv.style.borderRadius = '40px';
      labelDiv.style.border = '1px solid rgba(200, 150, 160, 0.2)';
      labelDiv.style.pointerEvents = 'none';
      labelDiv.style.maxWidth = '200px';
      
      const titleSpan = document.createElement('div');
      titleSpan.style.fontSize = '17px';
      titleSpan.style.fontWeight = '500';
      titleSpan.style.letterSpacing = '1px';
      titleSpan.style.color = '#5a3f42';
      titleSpan.textContent = item.title;
      
      const descSpan = document.createElement('div');
      descSpan.style.fontSize = '11px';
      descSpan.style.fontWeight = '300';
      descSpan.style.color = '#6f5558';
      descSpan.style.marginTop = '2px';
      descSpan.textContent = item.desc;
      
      labelDiv.appendChild(titleSpan);
      labelDiv.appendChild(descSpan);
      
      const label = new CSS2DObject(labelDiv);
      label.position.set(x, y - frameHeight/2 - 0.3, z);
      scene.add(label);

      // 儲存數據
      const cardKey = canvas.uuid;
      const thumbUrls = generateThumbUrls(item.img);
      cardDataMap.set(cardKey, {
        imgUrl: item.img,
        title: item.title,
        desc: item.desc,
        concept: item.concept,
        thumbs: thumbUrls
      });

      cardMeshes.push({ canvas, imgMesh, edge, label, baseY: y, phase: index * 0.5, key: cardKey });
    });

    // --- 6. 中心裝飾 ---
    const centerLabelDiv = document.createElement('div');
    centerLabelDiv.style.color = '#5a3f42';
    centerLabelDiv.style.fontSize = '28px';
    centerLabelDiv.style.fontWeight = '200';
    centerLabelDiv.style.letterSpacing = '10px';
    centerLabelDiv.style.textShadow = '0 0 40px rgba(200, 120, 130, 0.2)';
    centerLabelDiv.style.background = 'rgba(255, 235, 230, 0.3)';
    centerLabelDiv.style.backdropFilter = 'blur(4px)';
    centerLabelDiv.style.padding = '8px 28px';
    centerLabelDiv.style.borderRadius = '60px';
    centerLabelDiv.style.border = '1px solid rgba(200, 150, 160, 0.15)';
    centerLabelDiv.textContent = '✦ 鄭雨絲 ✦';
    const centerLabel = new CSS2DObject(centerLabelDiv);
    centerLabel.position.set(0, 1.9, -2.2);
    scene.add(centerLabel);

    // 小立柱
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xe8d0ca, emissive: 0xccb0aa, roughness: 0.7, metalness: 0.1 });
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const r = 6.0;
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.12, 0.3, 6), pillarMat);
      pillar.position.set(Math.sin(angle) * r, -0.5, Math.cos(angle) * r - 0.8);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      scene.add(pillar);
    }
    const glowLight = new THREE.PointLight(0xffaa88, 0.25);
    glowLight.position.set(0, 1, -1);
    scene.add(glowLight);

    // --- 7. 點擊交互: 打開詳情彈窗 ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let currentMainUrl = '';

    function openDetail(cardKey) {
      const data = cardDataMap.get(cardKey);
      if (!data) return;
      
      currentMainUrl = data.imgUrl;
      detailMainImg.src = currentMainUrl;
      detailTitle.textContent = data.title;
      detailSub.textContent = data.desc;
      detailConcept.textContent = data.concept || '暫無創作理念';

      detailThumbs.innerHTML = '';
      const thumbs = data.thumbs || [data.imgUrl];
      thumbs.forEach((thumbUrl, idx) => {
        const thumb = document.createElement('img');
        thumb.className = 'thumb-img';
        thumb.src = thumbUrl;
        thumb.alt = `局部${idx+1}`;
        thumb.dataset.url = thumbUrl;
        if (idx === 0) thumb.classList.add('active');
        thumb.addEventListener('click', (e) => {
          e.stopPropagation();
          currentMainUrl = thumbUrl;
          detailMainImg.src = thumbUrl;
          document.querySelectorAll('.thumb-img').forEach(el => el.classList.remove('active'));
          thumb.classList.add('active');
        });
        detailThumbs.appendChild(thumb);
      });

      detailOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
      detailOverlay.classList.remove('active');
      document.body.style.overflow = '';
      detailMainImg.src = '';
      detailThumbs.innerHTML = '';
    }

    function onPointerClick(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const meshes = cardMeshes.map(item => item.canvas);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        const cardKey = hitMesh.uuid;
        if (cardDataMap.has(cardKey)) {
          openDetail(cardKey);
        }
      }
    }

    renderer.domElement.addEventListener('click', onPointerClick);

    detailClose.addEventListener('click', closeDetail);
    detailOverlay.addEventListener('click', (e) => {
      if (e.target === detailOverlay) closeDetail();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetail();
    });

    detailMainImg.addEventListener('click', () => {
      if (detailMainImg.style.transform === 'scale(1.4)') {
        detailMainImg.style.transform = 'scale(1)';
        detailMainImg.style.cursor = 'zoom-in';
      } else {
        detailMainImg.style.transform = 'scale(1.4)';
        detailMainImg.style.cursor = 'zoom-out';
      }
    });

    // --- 8. 動畫循環 ---
    function animate() {
      const elapsedTime = performance.now() * 0.001;

      cardMeshes.forEach((item, idx) => {
        const offsetY = Math.sin(elapsedTime * 0.4 + idx * 0.6) * 0.025;
        const baseY = 0.2 + Math.sin((idx / cardMeshes.length) * 6.28 * 0.5) * 0.3;
        const newY = baseY + offsetY;
        item.canvas.position.y = newY;
        item.imgMesh.position.y = newY;
        item.edge.position.y = newY;
        item.label.position.y = newY - 0.25;
      });

      particles.rotation.y += 0.0002;
      controls.update();

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // --- 9. 自適應 ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    setTimeout(() => {
      document.getElementById('loading')?.classList.add('hide');
    }, 500);

    console.log('🌸 粉系VR展廳 · 臥遊版已啟動 | 點擊畫作查看細節與理念');
  </script>
</body>
</html>
