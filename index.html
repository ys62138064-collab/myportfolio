<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>郑雨丝 · 粉系VR展厅</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', '华文细黑', 'Microsoft YaHei', sans-serif;
    }
    #info {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #4a3f4a;
      font-size: 14px;
      letter-spacing: 2px;
      background: rgba(255, 240, 235, 0.5);
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      width: fit-content;
      margin: 0 auto;
      border-radius: 60px;
      border: 1px solid rgba(200, 150, 160, 0.25);
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 6px rgba(255, 220, 210, 0.3);
      box-shadow: 0 4px 20px rgba(180, 100, 120, 0.1);
    }
    #info span {
      opacity: 0.7;
      font-weight: 300;
    }
    @media (max-width: 600px) {
      #info { font-size: 11px; padding: 4px 14px; bottom: 12px; }
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fce9e6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7a5a62;
      font-size: 20px;
      letter-spacing: 6px;
      z-index: 999;
      transition: opacity 0.8s ease;
      pointer-events: none;
      font-weight: 300;
      text-shadow: 0 2px 12px rgba(200, 120, 140, 0.2);
    }
    #loading.hide {
      opacity: 0;
    }
    /* 点击放大查看器 (Modal) */
    #viewer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(30, 20, 25, 0.7);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      animation: fadeIn 0.3s ease;
    }
    #viewer-overlay.active {
      display: flex;
    }
    #viewer-image {
      max-width: 90%;
      max-height: 90%;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255, 215, 200, 0.15);
      object-fit: contain;
      background: #1a1418;
      transition: transform 0.2s ease;
      cursor: zoom-out;
    }
    #viewer-close {
      position: absolute;
      top: 30px;
      right: 40px;
      color: #f0e0da;
      font-size: 40px;
      font-weight: 200;
      cursor: pointer;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 215, 200, 0.15);
      transition: all 0.2s;
      user-select: none;
    }
    #viewer-close:hover {
      background: rgba(60, 40, 45, 0.6);
      transform: scale(1.05);
    }
    #viewer-title {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      text-align: center;
      color: #f0e0da;
      font-size: 20px;
      letter-spacing: 4px;
      font-weight: 300;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
      pointer-events: none;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(4px);
      padding: 10px 20px;
      width: fit-content;
      margin: 0 auto;
      border-radius: 60px;
      border: 1px solid rgba(255, 215, 200, 0.1);
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .click-hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #7a5a62;
      background: rgba(255, 235, 230, 0.6);
      backdrop-filter: blur(4px);
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 13px;
      letter-spacing: 2px;
      border: 1px solid rgba(200, 150, 160, 0.2);
      pointer-events: none;
      z-index: 10;
      opacity: 0.8;
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      .click-hint { bottom: 70px; font-size: 11px; padding: 4px 14px; }
      #viewer-close { top: 20px; right: 20px; width: 44px; height: 44px; font-size: 28px; }
      #viewer-title { font-size: 16px; bottom: 24px; padding: 6px 16px; }
    }
  </style>
</head>
<body>
  <div id="loading">✦ 加载艺术空间 ✦</div>
  <div id="info">🖱️ 拖拽旋转 · 滚轮缩放 · 点击画作放大 🔍 <span>「 郑雨丝 · 粉系VR 」</span></div>
  <div class="click-hint">🖱️ 点击画作 · 清晰放大</div>

  <!-- 放大查看器 -->
  <div id="viewer-overlay">
    <div id="viewer-close">✕</div>
    <img id="viewer-image" src="" alt="画作放大">
    <div id="viewer-title"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- 获取DOM元素 ---
    const viewerOverlay = document.getElementById('viewer-overlay');
    const viewerImage = document.getElementById('viewer-image');
    const viewerTitle = document.getElementById('viewer-title');
    const viewerClose = document.getElementById('viewer-close');

    // --- 1. 场景 / 相机 / 渲染器 (粉系渐变) ---
    const scene = new THREE.Scene();
    // 粉系渐变背景 (CanvasTexture)
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, '#fad9d5');
    gradient.addColorStop(0.4, '#f8cfcf');
    gradient.addColorStop(0.7, '#f0c0c4');
    gradient.addColorStop(1, '#e8b4b8');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const bgTexture = new THREE.CanvasTexture(canvas);
    scene.background = bgTexture;

    scene.fog = new THREE.FogExp2(0xf0d0ce, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.2, 11);
    camera.lookAt(0, 0.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    // --- 2. 控制器 ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.6;
    controls.zoomSpeed = 0.8;
    controls.panSpeed = 0.4;
    controls.screenSpacePanning = true;
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 2.5;
    controls.maxDistance = 18;
    controls.target.set(0, 0.6, 0);

    // --- 3. 灯光 (柔粉) ---
    const ambientLight = new THREE.AmbientLight(0xffd9d0, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffe0dd, 1.0);
    mainLight.position.set(3, 6, 6);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);

    const backLight = new THREE.DirectionalLight(0xffccdd, 0.6);
    backLight.position.set(-3, 2, -6);
    scene.add(backLight);

    const fillLight = new THREE.PointLight(0xffb0aa, 0.5);
    fillLight.position.set(0, 3, 4);
    scene.add(fillLight);

    const bottomLight = new THREE.PointLight(0xffaa99, 0.3);
    bottomLight.position.set(0, -2, 2);
    scene.add(bottomLight);

    // --- 4. 地面 (粉系半透) ---
    const floorGeometry = new THREE.CircleGeometry(8, 32);
    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0xf2d6d0,
      roughness: 0.9,
      metalness: 0.0,
      transparent: true,
      opacity: 0.25,
      side: THREE.DoubleSide
    });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.6;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(12, 12, 0xccb0b0, 0xbb9a9a);
    gridHelper.position.y = -0.55;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.12;
    scene.add(gridHelper);

    // 粒子
    const particleCount = 350;
    const particlesGeo = new THREE.BufferGeometry();
    const particlesPos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      particlesPos[i] = (Math.random() - 0.5) * 28;
      particlesPos[i+1] = (Math.random() - 0.5) * 14;
      particlesPos[i+2] = (Math.random() - 0.5) * 20 - 4;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPos, 3));
    const particlesMat = new THREE.PointsMaterial({
      color: 0xdbb0b0,
      size: 0.05,
      transparent: true,
      opacity: 0.3,
      blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particles);

    // --- 5. 画作数据 ---
    const artworks = [
      { img: '图片1.jpg', title: '悠然自得', desc: '2025 · 宣纸 38x38cm' },
      { img: '图片2.jpg', title: '镜中蜃楼', desc: '2025 · 卷轴 42x79cm' },
      { img: '图片3.jpg', title: '香飘四溢', desc: '2025 · 宣纸 38x38cm' },
      { img: '图片4.jpg', title: '懒惰猫猫', desc: '2025 · 42x29.7cm' },
      { img: '图片5.jpg', title: '旋转木马', desc: '2025 · 卷轴 80x31cm' },
      { img: '图片6.jpg', title: '丹顶鹤寿', desc: '2025 · 宣纸 33x28cm' },
      { img: '图片7.jpg', title: '鱼跃团圆', desc: '2025 · 宣纸 36.5x27cm' },
      { img: '图片8.jpg', title: '栀子锦簇', desc: '2025 · 宣纸 33.5x27.5cm' },
      { img: '图片9.jpg', title: '凤冠霞帔', desc: '2025 · 宣纸 42x29.7cm' },
      { img: '图片10.jpg', title: '聘婷袅娜·女冠', desc: '2025 · 卷轴 34x80cm' },
      { img: '图片11.jpg', title: '玉簪', desc: '2025 · 宣纸 38x38cm' },
      { img: '图片12.jpg', title: '清馬騰飛', desc: '2025 · 宣纸 38x38cm' },
      { img: '图片13.jpg', title: '郑雨丝 · 艺术家', desc: '暨南大学 · 港大进修 · 教大研究生' }
    ];

    const cardMeshes = [];
    const radius = 5.6;
    const startAngle = -1.2;
    const angleStep = (2.4) / (artworks.length - 1);

    // 存储每个卡片对应的图片URL和标题 (用于点击放大)
    const cardDataMap = new Map();

    artworks.forEach((item, index) => {
      const angle = startAngle + index * angleStep;
      const x = Math.sin(angle) * radius;
      const z = Math.cos(angle) * radius - 1.5;
      const y = 0.2 + Math.sin(angle * 1.5) * 0.3;

      const frameWidth = 1.9;
      const frameHeight = 2.1;
      const depth = 0.12;

      // 画板
      const canvasMat = new THREE.MeshStandardMaterial({
        color: 0xf5e0dc,
        roughness: 0.5,
        metalness: 0.05,
        side: THREE.DoubleSide
      });
      const canvasGeo = new THREE.BoxGeometry(frameWidth, frameHeight, depth);
      const canvas = new THREE.Mesh(canvasGeo, canvasMat);
      canvas.castShadow = true;
      canvas.receiveShadow = true;
      canvas.position.set(x, y, z);

      // 图片 (高清晰度纹理)
      const textureLoader = new THREE.TextureLoader();
      const placeholderMat = new THREE.MeshStandardMaterial({
        color: 0xe8d0ca,
        roughness: 0.6,
        metalness: 0.05,
      });
      const imgMesh = new THREE.Mesh(new THREE.PlaneGeometry(frameWidth * 0.85, frameHeight * 0.85), placeholderMat);
      imgMesh.position.set(x, y, z + depth/2 + 0.005);
      imgMesh.castShadow = false;
      imgMesh.receiveShadow = false;

      // 加载纹理 (使用高分辨率)
      textureLoader.load(item.img, (texture) => {
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy(); // 提高清晰度
        imgMesh.material = new THREE.MeshStandardMaterial({
          map: texture,
          roughness: 0.3,
          metalness: 0.02,
          side: THREE.DoubleSide,
        });
        imgMesh.material.needsUpdate = true;
      }, undefined, () => {
        imgMesh.material.color.setHex(0xdbb8b0);
      });

      scene.add(canvas);
      scene.add(imgMesh);

      // 边框
      const edgeMat = new THREE.MeshStandardMaterial({
        color: 0xe8c8c0,
        emissive: 0xccaaa0,
        roughness: 0.3,
        metalness: 0.4,
        transparent: true,
        opacity: 0.25
      });
      const edgeGeo = new THREE.BoxGeometry(frameWidth + 0.08, frameHeight + 0.08, 0.04);
      const edge = new THREE.Mesh(edgeGeo, edgeMat);
      edge.position.set(x, y, z + depth/2 + 0.02);
      scene.add(edge);

      // 标签
      const labelDiv = document.createElement('div');
      labelDiv.style.color = '#5a3f42';
      labelDiv.style.fontFamily = '"Segoe UI", "华文细黑", sans-serif';
      labelDiv.style.textAlign = 'center';
      labelDiv.style.textShadow = '0 2px 20px rgba(255,220,210,0.5), 0 0 12px rgba(255,200,190,0.3)';
      labelDiv.style.background = 'rgba(255, 240, 235, 0.5)';
      labelDiv.style.backdropFilter = 'blur(6px)';
      labelDiv.style.padding = '5px 14px 7px 14px';
      labelDiv.style.borderRadius = '40px';
      labelDiv.style.border = '1px solid rgba(200, 150, 160, 0.2)';
      labelDiv.style.pointerEvents = 'none';
      labelDiv.style.maxWidth = '200px';
      
      const titleSpan = document.createElement('div');
      titleSpan.style.fontSize = '17px';
      titleSpan.style.fontWeight = '500';
      titleSpan.style.letterSpacing = '1px';
      titleSpan.style.color = '#5a3f42';
      titleSpan.textContent = item.title;
      
      const descSpan = document.createElement('div');
      descSpan.style.fontSize = '11px';
      descSpan.style.fontWeight = '300';
      descSpan.style.color = '#6f5558';
      descSpan.style.marginTop = '2px';
      descSpan.textContent = item.desc;
      
      labelDiv.appendChild(titleSpan);
      labelDiv.appendChild(descSpan);
      
      const label = new CSS2DObject(labelDiv);
      label.position.set(x, y - frameHeight/2 - 0.3, z);
      scene.add(label);

      // 存储卡片数据 (用于点击放大)
      const cardKey = canvas.uuid;
      cardDataMap.set(cardKey, {
        imgUrl: item.img,
        title: item.title,
        desc: item.desc
      });

      cardMeshes.push({ canvas, imgMesh, edge, label, baseY: y, phase: index * 0.5, key: cardKey });
    });

    // --- 6. 中心装饰 ---
    const centerLabelDiv = document.createElement('div');
    centerLabelDiv.style.color = '#5a3f42';
    centerLabelDiv.style.fontSize = '28px';
    centerLabelDiv.style.fontWeight = '200';
    centerLabelDiv.style.letterSpacing = '10px';
    centerLabelDiv.style.textShadow = '0 0 40px rgba(200, 120, 130, 0.2)';
    centerLabelDiv.style.background = 'rgba(255, 235, 230, 0.3)';
    centerLabelDiv.style.backdropFilter = 'blur(4px)';
    centerLabelDiv.style.padding = '8px 28px';
    centerLabelDiv.style.borderRadius = '60px';
    centerLabelDiv.style.border = '1px solid rgba(200, 150, 160, 0.15)';
    centerLabelDiv.textContent = '✦ 郑雨丝 ✦';
    const centerLabel = new CSS2DObject(centerLabelDiv);
    centerLabel.position.set(0, 1.9, -2.2);
    scene.add(centerLabel);

    // 小立柱
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xe8d0ca, emissive: 0xccb0aa, roughness: 0.7, metalness: 0.1 });
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const r = 6.0;
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.12, 0.3, 6), pillarMat);
      pillar.position.set(Math.sin(angle) * r, -0.5, Math.cos(angle) * r - 0.8);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      scene.add(pillar);
    }

    const glowLight = new THREE.PointLight(0xffaa88, 0.25);
    glowLight.position.set(0, 1, -1);
    scene.add(glowLight);

    // --- 7. Raycaster 点击放大 ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onPointerClick(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const meshes = cardMeshes.map(item => item.canvas);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        const cardKey = hitMesh.uuid;
        const data = cardDataMap.get(cardKey);
        if (data) {
          // 显示放大查看器
          viewerImage.src = data.imgUrl;
          viewerTitle.textContent = `${data.title} · ${data.desc}`;
          viewerOverlay.classList.add('active');
        }
      }
    }

    renderer.domElement.addEventListener('click', onPointerClick);

    // 关闭查看器
    function closeViewer() {
      viewerOverlay.classList.remove('active');
      viewerImage.src = '';
    }
    viewerOverlay.addEventListener('click', (e) => {
      if (e.target === viewerOverlay || e.target === viewerImage) {
        closeViewer();
      }
    });
    viewerClose.addEventListener('click', closeViewer);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeViewer();
    });

    // --- 8. 动画 ---
    function animate() {
      const elapsedTime = performance.now() * 0.001;

      cardMeshes.forEach((item, idx) => {
        const offsetY = Math.sin(elapsedTime * 0.4 + idx * 0.6) * 0.025;
        const baseY = 0.2 + Math.sin((idx / cardMeshes.length) * 6.28 * 0.5) * 0.3;
        const newY = baseY + offsetY;
        item.canvas.position.y = newY;
        item.imgMesh.position.y = newY;
        item.edge.position.y = newY;
        item.label.position.y = newY - 0.25;
      });

      particles.rotation.y += 0.0002;
      controls.update();

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // --- 9. 自适应 ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    setTimeout(() => {
      document.getElementById('loading')?.classList.add('hide');
    }, 500);

    console.log('🌸 粉系VR展厅已启动 | 点击画作放大');
  </script>
</body>
</html>
