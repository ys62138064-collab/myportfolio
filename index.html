<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郑雨丝 · 3D水墨画廊</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Georgia', '宋体', serif; }
        #info {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        #info span {
            background: rgba(0,0,0,0.4);
            padding: 8px 28px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        #loading {
            position: fixed;
            inset: 0;
            background: #1a1714;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbb8a8;
            font-size: 22px;
            letter-spacing: 8px;
            z-index: 999;
            transition: opacity 1.2s;
        }
        #loading.hide { opacity: 0; pointer-events: none; }
        @media (max-width: 640px) {
            #info { font-size: 11px; bottom: 16px; }
            #info span { padding: 4px 16px; }
        }
        /* 图片加载失败时的占位样式 */
        .error-placeholder {
            background: linear-gradient(135deg, #2d2822, #4d3f34);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a68e7a;
            font-size: 12px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="loading">✦ 加载中 ✦</div>
    <div id="info"><span>🖱️ 拖拽旋转 · 滚轮缩放 · 点击画作看理念</span></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1714);

        // --- 相机 ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.8, 5.5);
        camera.lookAt(0, 0.5, 0);

        // --- 渲染器 ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- CSS2渲染器 ---
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- 控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.6, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 1.8;
        controls.maxDistance = 10;
        controls.update();

        // --- 灯光 ---
        const ambient = new THREE.AmbientLight(0xd9ccbe, 0.5);
        scene.add(ambient);
        const mainLight = new THREE.DirectionalLight(0xffe4c4, 1.0);
        mainLight.position.set(3, 8, 6);
        mainLight.castShadow = true;
        scene.add(mainLight);
        const fillLight = new THREE.DirectionalLight(0xb8c8e0, 0.4);
        fillLight.position.set(-4, 5, 7);
        scene.add(fillLight);
        const backLight = new THREE.DirectionalLight(0xe6d5c0, 0.2);
        backLight.position.set(0, 2, -6);
        scene.add(backLight);

        // --- 地面 ---
        const groundGeo = new THREE.CircleGeometry(8, 64);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x2d2822,
            roughness: 0.85,
            metalness: 0.05,
            transparent: true,
            opacity: 0.9,
            side: THREE.DoubleSide
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.15;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- 装饰圆环 ---
        const ringMat = new THREE.MeshStandardMaterial({
            color: 0x4d3f34,
            transparent: true,
            opacity: 0.08,
            side: THREE.DoubleSide
        });
        const ring1 = new THREE.Mesh(new THREE.RingGeometry(1.6, 2.8, 64), ringMat);
        ring1.rotation.x = -Math.PI / 2;
        ring1.position.set(0, 0.01, -1.2);
        scene.add(ring1);
        const ring2 = new THREE.Mesh(new THREE.RingGeometry(0.8, 1.4, 64), ringMat);
        ring2.material = ringMat.clone();
        ring2.material.opacity = 0.05;
        ring2.material.color.setHex(0xa68e7a);
        ring2.rotation.x = -Math.PI / 2;
        ring2.position.set(0, 0.02, -1.2);
        scene.add(ring2);

        // --- 创建占位纹理 (当图片加载失败时使用) ---
        function createPlaceholderTexture(color1 = '#4d3f34', color2 = '#2d2822', text = '') {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // 渐变背景
            const grad = ctx.createLinearGradient(0, 0, 512, 512);
            grad.addColorStop(0, color1);
            grad.addColorStop(1, color2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);
            
            // 边框装饰
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 4;
            ctx.strokeRect(20, 20, 472, 472);
            
            // 文字
            if (text) {
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '36px Georgia, serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 256, 256);
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // --- 辅助函数：创建作品展板 ---
        function createArtwork(imageSrc, title, sizeInfo, conceptText, pos, rotY, index) {
            const group = new THREE.Group();
            group.position.set(pos.x, pos.y, pos.z);
            group.rotation.y = rotY;

            // 画框背景
            const frameMat = new THREE.MeshStandardMaterial({
                color: 0x1f1b16,
                roughness: 0.5,
                metalness: 0.2,
                side: THREE.DoubleSide
            });
            const frame = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.8), frameMat);
            frame.position.z = 0;
            frame.castShadow = true;
            group.add(frame);

            // 创建占位纹理（作为备用）
            const colors = ['#4d3f34', '#5a4a3a', '#3d352c', '#4a3f35', '#5a4a3a', '#3d352c', '#4a3f35'];
            const placeholderTex = createPlaceholderTexture(
                colors[index % colors.length], 
                '#2d2822', 
                '🎨'
            );

            // 加载图片
            const textureLoader = new THREE.TextureLoader();
            let textureLoaded = false;
            
            // 先使用占位纹理
            const imgMat = new THREE.MeshStandardMaterial({
                map: placeholderTex,
                side: THREE.DoubleSide,
                roughness: 0.6,
                metalness: 0.1
            });
            const img = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.6), imgMat);
            img.position.z = 0.01;
            img.userData = { concept: conceptText, title: title };
            img.name = 'artwork';
            group.add(img);

            // 尝试加载真实图片
            textureLoader.load(
                imageSrc,
                (texture) => {
                    img.material.map = texture;
                    img.material.needsUpdate = true;
                    console.log(`✅ ${imageSrc} 加载成功`);
                    textureLoaded = true;
                },
                undefined,
                (err) => {
                    console.warn(`⚠️ ${imageSrc} 加载失败，使用占位图`, err);
                    // 保持占位纹理
                }
            );

            // 标题标签
            const labelDiv = document.createElement('div');
            labelDiv.textContent = `${title} ${sizeInfo}`;
            labelDiv.style.color = '#e8ddd0';
            labelDiv.style.fontSize = '14px';
            labelDiv.style.fontFamily = 'Georgia, "宋体", serif';
            labelDiv.style.background = 'rgba(0,0,0,0.5)';
            labelDiv.style.padding = '4px 14px';
            labelDiv.style.borderRadius = '4px';
            labelDiv.style.letterSpacing = '1px';
            labelDiv.style.backdropFilter = 'blur(2px)';
            labelDiv.style.border = '1px solid rgba(255,255,255,0.05)';
            labelDiv.style.pointerEvents = 'none';
            const label = new CSS2DObject(labelDiv);
            label.position.set(0, -1.1, 0.05);
            group.add(label);

            // 概念标签
            const conceptDiv = document.createElement('div');
            conceptDiv.textContent = conceptText;
            conceptDiv.style.color = '#f5ede4';
            conceptDiv.style.fontSize = '13px';
            conceptDiv.style.fontFamily = 'Georgia, "宋体", serif';
            conceptDiv.style.background = 'rgba(30,25,20,0.88)';
            conceptDiv.style.padding = '8px 16px';
            conceptDiv.style.borderRadius = '6px';
            conceptDiv.style.maxWidth = '280px';
            conceptDiv.style.textAlign = 'center';
            conceptDiv.style.lineHeight = '1.6';
            conceptDiv.style.backdropFilter = 'blur(4px)';
            conceptDiv.style.border = '1px solid rgba(255,255,255,0.08)';
            conceptDiv.style.boxShadow = '0 4px 20px rgba(0,0,0,0.5)';
            conceptDiv.style.pointerEvents = 'none';
            conceptDiv.style.display = 'none';
            const conceptLabel = new CSS2DObject(conceptDiv);
            conceptLabel.position.set(0, 0.35, 0.8);
            group.add(conceptLabel);

            group.userData = { conceptLabel, conceptDiv, img };

            return group;
        }

        // --- 作品数据 ---
        const artworks = [
            {
                src: '图片1.jpg',
                title: '《悠然自得》',
                size: 'W38×H38cm 宣纸',
                concept: '北宋王希孟千里江山图 · 重峦叠嶂融入茶杯 · 夏日明艳色彩 · 喧嚣城中觅净土',
                pos: { x: -3.5, y: 0.9, z: -1.8 },
                rot: 0.35
            },
            {
                src: '图片2.jpg',
                title: '《镜中蜃楼》',
                size: 'W34×H34cm 卷轴',
                concept: '建筑融入镜中花 · 夏日治愈色调 · 喧嚣中寻净土',
                pos: { x: -1.8, y: 0.9, z: -3.5 },
                rot: 0.08
            },
            {
                src: '图片3.jpg',
                title: '《香飘四溢》',
                size: 'W38×H38cm 宣纸',
                concept: '奶茶 · 维港海景 · 东门烟火 · 卸下疲惫',
                pos: { x: 0.2, y: 0.9, z: -4.2 },
                rot: -0.12
            },
            {
                src: '图片4.jpg',
                title: '《旋转木马》',
                size: 'H35.5×W23cm 卷轴',
                concept: '童年记忆 · 游乐场 · 纯真童话 · 欢声笑语',
                pos: { x: 2.0, y: 0.9, z: -3.5 },
                rot: -0.08
            },
            {
                src: '图片5.jpg',
                title: '《玉簪》',
                size: 'W38×H38cm 宣纸',
                concept: '君子比德于玉 · 马卡龙色彩 · 幸运之意',
                pos: { x: 3.5, y: 0.9, z: -1.8 },
                rot: -0.35
            },
            {
                src: '图片6.jpg',
                title: '《凤冠霞帔》',
                size: 'W42×H29.7cm',
                concept: '传统婚礼 · 女性美学 · 古今韵味 · 缤纷色彩',
                pos: { x: 3.0, y: 0.9, z: 1.2 },
                rot: -0.65
            },
            {
                src: '图片7.jpg',
                title: '《女冠一·二》',
                size: 'W34×H33cm 卷轴',
                concept: '女冠礼冠 · 古韵美 · 暖色向往 · 精神寄托',
                pos: { x: -3.0, y: 0.9, z: 1.2 },
                rot: 0.65
            }
        ];

        // --- 创建并添加所有作品 ---
        artworks.forEach((data, index) => {
            const group = createArtwork(
                data.src,
                data.title,
                data.size,
                data.concept,
                data.pos,
                data.rot,
                index
            );
            scene.add(group);
        });

        // --- 左侧：艺术家简介展板 ---
        function createInfoPanel() {
            const group = new THREE.Group();
            group.position.set(-4.8, 0.5, 0.3);
            group.rotation.y = -0.8;

            const panelMat = new THREE.MeshStandardMaterial({
                color: 0x28221d,
                roughness: 0.7,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });
            const panel = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 2.6), panelMat);
            panel.position.z = 0;
            group.add(panel);

            const lines = [
                { text: '郑雨丝', size: '24px', y: 1.1, color: '#eeddcc' },
                { text: '2023 暨南大学 本科', size: '12px', y: 0.65, color: '#ccbbaa' },
                { text: '2024 港大专业进修', size: '12px', y: 0.25, color: '#ccbbaa' },
                { text: '2026 香港教育大学 研', size: '12px', y: -0.15, color: '#ccbbaa' },
                { text: '个展 · 山有扶苏', size: '12px', y: -0.55, color: '#dacfc6' },
                { text: '隰有荷华', size: '12px', y: -0.90, color: '#dacfc6' },
                { text: '工笔 · 现代水墨', size: '12px', y: -1.25, color: '#b8a79a' },
                { text: '恬静淡雅 · 不失风韵', size: '12px', y: -1.60, color: '#b8a79a' }
            ];

            lines.forEach(item => {
                const div = document.createElement('div');
                div.textContent = item.text;
                div.style.color = item.color;
                div.style.fontSize = item.size;
                div.style.fontFamily = 'Georgia, "宋体", serif';
                div.style.textShadow = '0 2px 8px rgba(0,0,0,0.5)';
                div.style.letterSpacing = '1px';
                div.style.pointerEvents = 'none';
                const label = new CSS2DObject(div);
                label.position.set(0, item.y, 0.05);
                group.add(label);
            });

            return group;
        }
        scene.add(createInfoPanel());

        // --- 右侧：美学关键词 ---
        function createAestheticPanel() {
            const group = new THREE.Group();
            group.position.set(4.8, 0.5, -0.3);
            group.rotation.y = 0.8;

            const panelMat = new THREE.MeshStandardMaterial({
                color: 0x1e1a16,
                transparent: true,
                opacity: 0.4,
                side: THREE.DoubleSide
            });
            const panel = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 2.0), panelMat);
            panel.position.z = 0;
            group.add(panel);

            const items = [
                { text: '美学 · 韵味', size: '18px', y: 0.7, color: '#e6d6c4' },
                { text: '细腻线条', size: '12px', y: 0.25, color: '#cbb8a8' },
                { text: '墨水晕染', size: '12px', y: -0.15, color: '#cbb8a8' },
                { text: '色彩情感', size: '12px', y: -0.55, color: '#cbb8a8' },
                { text: '恬静淡雅', size: '12px', y: -0.95, color: '#b8a79a' }
            ];

            items.forEach(item => {
                const div = document.createElement('div');
                div.textContent = item.text;
                div.style.color = item.color;
                div.style.fontSize = item.size;
                div.style.fontFamily = 'Georgia, "宋体", serif';
                div.style.textShadow = '0 2px 8px rgba(0,0,0,0.5)';
                div.style.letterSpacing = '1px';
                div.style.pointerEvents = 'none';
                const label = new CSS2DObject(div);
                label.position.set(0, item.y, 0.05);
                group.add(label);
            });

            return group;
        }
        scene.add(createAestheticPanel());

        // --- 顶部标题 ---
        function createTitle() {
            const group = new THREE.Group();
            group.position.set(0, 2.4, -3.8);

            const titleDiv = document.createElement('div');
            titleDiv.textContent = '郑雨丝 · 水墨之境';
            titleDiv.style.color = '#efe6db';
            titleDiv.style.fontSize = '28px';
            titleDiv.style.fontFamily = 'Georgia, "宋体", serif';
            titleDiv.style.background = 'rgba(20,18,16,0.6)';
            titleDiv.style.padding = '8px 30px';
            titleDiv.style.borderRadius = '8px';
            titleDiv.style.backdropFilter = 'blur(4px)';
            titleDiv.style.border = '1px solid rgba(255,255,255,0.06)';
            titleDiv.style.letterSpacing = '4px';
            titleDiv.style.pointerEvents = 'none';
            const titleLabel = new CSS2DObject(titleDiv);
            titleLabel.position.set(0, 0, 0);
            group.add(titleLabel);

            const subDiv = document.createElement('div');
            subDiv.textContent = '工笔 · 现代 · 恬静淡雅';
            subDiv.style.color = '#cbb8a8';
            subDiv.style.fontSize = '14px';
            subDiv.style.fontFamily = 'Georgia, "宋体", serif';
            subDiv.style.background = 'rgba(10,10,10,0.3)';
            subDiv.style.padding = '4px 18px';
            subDiv.style.borderRadius = '6px';
            subDiv.style.letterSpacing = '2px';
            subDiv.style.pointerEvents = 'none';
            const subLabel = new CSS2DObject(subDiv);
            subLabel.position.set(0, -0.6, 0);
            group.add(subLabel);

            return group;
        }
        scene.add(createTitle());

        // --- 底部提示 ---
        function createFooter() {
            const group = new THREE.Group();
            group.position.set(0, -0.3, -3.5);

            const div = document.createElement('div');
            div.textContent = '🖱️ 拖拽旋转 · 滚轮缩放 · 点击画作看理念';
            div.style.color = 'rgba(200,200,200,0.6)';
            div.style.fontSize = '14px';
            div.style.fontFamily = 'Georgia, "宋体", serif';
            div.style.background = 'rgba(0,0,0,0.2)';
            div.style.padding = '6px 20px';
            div.style.borderRadius = '6px';
            div.style.backdropFilter = 'blur(2px)';
            div.style.letterSpacing = '1px';
            div.style.border = '1px solid rgba(255,255,255,0.04)';
            div.style.pointerEvents = 'none';
            const label = new CSS2DObject(div);
            group.add(label);
            return group;
        }
        scene.add(createFooter());

        // --- 射线检测器 (点击交互) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (event) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const meshes = [];
            scene.traverse((child) => {
                if (child.isMesh && child.name === 'artwork') {
                    meshes.push(child);
                }
            });

            const intersects = raycaster.intersectObjects(meshes);
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                const parent = hit.parent;
                if (parent && parent.userData && parent.userData.conceptLabel) {
                    const { conceptDiv } = parent.userData;
                    if (conceptDiv.style.display === 'none') {
                        conceptDiv.style.display = 'block';
                        setTimeout(() => {
                            conceptDiv.style.display = 'none';
                        }, 4000);
                    } else {
                        conceptDiv.style.display = 'none';
                    }
                }
            }
        });

        // --- 窗口自适应 ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        });

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        // --- 隐藏加载画面 ---
        setTimeout(() => {
            document.getElementById('loading').classList.add('hide');
        }, 800);

        console.log('🎨 3D 画廊已启动！');
        console.log('📁 请确保图片文件与HTML在同一目录下');
        console.log('📸 图片路径: 图片1.jpg ~ 图片7.jpg');
    </script>
</body>
</html>
