<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>郑雨丝 · 艺境漫游 · 3D VR画廊</title>
    <!-- A-frame 核心库 & 额外组件 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- 用于平滑摄像机移动 -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #5a3e4b;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 220, 230, 0.8);
            pointer-events: none;
            z-index: 10;
            background: rgba(255, 240, 245, 0.3);
            backdrop-filter: blur(4px);
            padding: 12px 0;
            border-radius: 30px;
            max-width: 600px;
            margin: 0 auto 20px;
            left: 50%;
            transform: translateX(-50%);
            border: 1px solid rgba(255, 200, 210, 0.5);
            box-shadow: 0 4px 20px rgba(255, 180, 190, 0.2);
        }
        #info a {
            color: #a05f7a;
            font-weight: 500;
            text-decoration: none;
            border-bottom: 1px dashed #d9a3b0;
        }
        @media (max-width: 600px) {
            #info { font-size: 10px; max-width: 90%; padding: 8px 0; bottom: 10px; }
        }
        /* 加载提示 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #7a4b5e;
            background: rgba(255, 235, 240, 0.8);
            padding: 20px 40px;
            border-radius: 60px;
            backdrop-filter: blur(6px);
            border: 1px solid #f7d0db;
            font-weight: 300;
            letter-spacing: 4px;
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="loading" id="loading">🌸 加载画境中 ...</div>
    <div id="info">
        🎨 郑雨丝 · 艺境漫游 · 拖动视角 / 点击画框欣赏 · 粉色柔光VR
    </div>

    <a-scene 
        background="color: #fce4ec" 
        fog="type: exponential; color: #fce4ec; density: 0.012"
        vr-mode-ui="enabled: true"
        cursor="rayOrigin: mouse"
        raycaster="far: 20; interval: 100; objects: .clickable"
        light="defaultLightsEnabled: false; ambient: #ffe4ec;"
        >

        <!-- 柔和粉色光源 -->
        <a-light type="ambient" color="#ffd9e5" intensity="0.7"></a-light>
        <a-light type="hemisphere" color="#ffb6c9" groundColor="#fad1d6" intensity="0.9"></a-light>
        <a-light type="point" color="#ffa5b9" position="2 4 6" intensity="0.6"></a-light>
        <a-light type="point" color="#ffb0c0" position="-4 3 -5" intensity="0.5"></a-light>
        <a-light type="directional" color="#ffe2ed" position="1 5 3" intensity="0.7"></a-light>

        <!-- 摄像机 + 轨道控制 (平滑移动) -->
        <a-entity camera="userHeight: 1.6; fov: 75" 
                  position="0 1.8 6" 
                  look-controls="reverseMouseDrag: true; touchEnabled: true"
                  wasd-controls="acceleration: 8; easing: 20"
                  rotation="0 0 0">
        </a-entity>

        <!-- 环境装饰：粉色粒子 / 花瓣 (轻量) -->
        <a-entity particle-system="preset: snow; particleCount: 150; color: #ffb7c5; size: 0.08; velocity: 0.008; opacity: 0.5; sizeSpread: 0.06;"></a-entity>

        <!-- ============= 画作展示墙 (环形布局) ============= -->
        <!-- 所有画作卡片：左墙 (Z负方向) 从右到左 -->
        <!-- 使用 a-entity 分组便于管理，每幅画包含画框、图片、文字浮标 -->

        <!-- 1. 悠然自得 (心境山水) -->
        <a-entity position="-2.8 1.0 -3.5" rotation="0 25 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3; metalness: 0.1" 
                     position="0 0 0" 
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img1}">
                <a-image src="图片1.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <!-- 金色画框边 -->
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <!-- 文字标签 -->
            <a-entity position="0 -1.0 0.1">
                <a-text value="《悠然自得》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15" position="0 0 0"></a-text>
                <a-text value="心境山水 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 2. 镜中蜃楼 (心境山水) -->
        <a-entity position="-1.2 1.0 -4.2" rotation="0 15 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3" 
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img2}">
                <a-image src="图片2.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <a-entity position="0 -1.0 0.1">
                <a-text value="《镜中蜃楼》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15"></a-text>
                <a-text value="心境山水 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 3. 香飘四溢 (生活雅趣) -->
        <a-entity position="0.8 1.0 -4.6" rotation="0 -5 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3"
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img3}">
                <a-image src="图片3.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <a-entity position="0 -1.0 0.1">
                <a-text value="《香飘四溢》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15"></a-text>
                <a-text value="生活雅趣 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 4. 懒惰猫猫 (生活雅趣) -->
        <a-entity position="2.4 1.0 -4.2" rotation="0 -20 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3"
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img4}">
                <a-image src="图片4.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <a-entity position="0 -1.0 0.1">
                <a-text value="《懒惰猫猫》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15"></a-text>
                <a-text value="生活雅趣 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 5. 旋转木马 (生活雅趣) -->
        <a-entity position="3.8 1.0 -3.2" rotation="0 -35 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3"
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img5}">
                <a-image src="图片5.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <a-entity position="0 -1.0 0.1">
                <a-text value="《旋转木马》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15"></a-text>
                <a-text value="生活雅趣 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 6. 丹顶鹤寿 (祥瑞祈愿) -->
        <a-entity position="4.5 1.0 -1.8" rotation="0 -50 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3"
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img6}">
                <a-image src="图片6.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <a-entity position="0 -1.0 0.1">
                <a-text value="《丹顶鹤寿》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15"></a-text>
                <a-text value="祥瑞祈愿 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 7. 鱼跃团圆 (祥瑞祈愿) -->
        <a-entity position="4.5 1.0 -0.2" rotation="0 -65 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3"
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img7}">
                <a-image src="图片7.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <a-entity position="0 -1.0 0.1">
                <a-text value="《鱼跃团圆》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15"></a-text>
                <a-text value="祥瑞祈愿 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 8. 栀子锦簇 (祥瑞祈愿) -->
        <a-entity position="4.2 1.0 1.2" rotation="0 -75 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3"
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img8}">
                <a-image src="图片8.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <a-entity position="0 -1.0 0.1">
                <a-text value="《栀子锦簇》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15"></a-text>
                <a-text value="祥瑞祈愿 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 9. 凤冠霞帔 (古韻新聲) -->
        <a-entity position="3.2 1.0 2.8" rotation="0 -85 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3"
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img9}">
                <a-image src="图片9.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <a-entity position="0 -1.0 0.1">
                <a-text value="《凤冠霞帔》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15"></a-text>
                <a-text value="古韻新聲 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 10. 聘婷袅娜 (古韻新聲) -->
        <a-entity position="1.8 1.0 3.8" rotation="0 -100 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3"
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img10}">
                <a-image src="图片10.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <a-entity position="0 -1.0 0.1">
                <a-text value="《聘婷袅娜》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15"></a-text>
                <a-text value="古韻新聲 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 11. 玉簪 (古韻新聲) -->
        <a-entity position="0.2 1.0 4.5" rotation="0 -110 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3"
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img11}">
                <a-image src="图片11.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <a-entity position="0 -1.0 0.1">
                <a-text value="《玉簪》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15"></a-text>
                <a-text value="古韻新聲 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 12. 清馬騰飛 (古韻新聲) -->
        <a-entity position="-1.5 1.0 4.2" rotation="0 -130 0">
            <a-plane class="clickable" width="1.6" height="1.6" color="#f8e1e8" material="side: double; roughness: 0.3"
                     event-set__click="_event: click; _target: #modal; _delay: 200; _props: {visible: true, src: #img12}">
                <a-image src="图片12.jpg" width="1.4" height="1.4" position="0 0.1 0.01"></a-image>
                <a-plane width="1.7" height="1.7" color="#d9b0be" position="0 0 -0.02" opacity="0.3"></a-plane>
            </a-plane>
            <a-entity position="0 -1.0 0.1">
                <a-text value="《清馬騰飛》" color="#5a3a47" align="center" width="2" font="helvetiker" size="0.15"></a-text>
                <a-text value="古韻新聲 · 2025" color="#8a5e6e" align="center" width="2" font="helvetiker" size="0.1" position="0 -0.25 0"></a-text>
            </a-entity>
        </a-entity>

        <!-- 13. 艺术家简介 (单独一个面板) 放置于进门左侧 -->
        <a-entity position="-3.8 1.0 1.5" rotation="0 40 0">
            <a-plane width="2.0" height="2.4" color="#fce4ec" material="side: double; roughness: 0.4; opacity: 0.85" 
                     position="0 0 0">
                <a-text value="郑雨丝 · 艺术家" color="#5a3a47" align="center" width="2.4" font="helvetiker" size="0.18" position="0 1.0 0.01"></a-text>
                <a-text value="2023 暨南大学本科" color="#7a4b5e" align="center" width="2.4" font="helvetiker" size="0.12" position="0 0.7 0.01"></a-text>
                <a-text value="2024 港大进修学院" color="#7a4b5e" align="center" width="2.4" font="helvetiker" size="0.12" position="0 0.45 0.01"></a-text>
                <a-text value="2026 香港教育大学研究生" color="#7a4b5e" align="center" width="2.4" font="helvetiker" size="0.12" position="0 0.2 0.01"></a-text>
                <a-text value="伦敦绘画奖 · 港深个展" color="#8a5e6e" align="center" width="2.4" font="helvetiker" size="0.11" position="0 -0.1 0.01"></a-text>
                <a-text value="工笔静物 · 现代仕女" color="#8a5e6e" align="center" width="2.4" font="helvetiker" size="0.11" position="0 -0.4 0.01"></a-text>
                <a-text value="「山有扶苏」深圳个展" color="#8a5e6e" align="center" width="2.4" font="helvetiker" size="0.11" position="0 -0.7 0.01"></a-text>
                <a-text value="—— 融古韵于今风 ——" color="#b07a8a" align="center" width="2.4" font="helvetiker" size="0.1" position="0 -1.0 0.01"></a-text>
            </a-plane>
        </a-entity>

        <!-- ========= 点击放大的modal (带文字理念) ========= -->
        <a-entity id="modal" visible="false" position="0 1.5 0" 
                  geometry="primitive: plane; width: 6; height: 6" 
                  material="color: #faeaf0; opacity: 0.92; roughness: 0.2; side: double; transparent: true"
                  event-set__click="_event: click; _target: #modal; _props: {visible: false}">
            <!-- 关闭按钮 (点击modal本身关闭) -->
            <a-image id="modalImage" src="" width="4.5" height="4.5" position="0 0.2 0.01"></a-image>
            <!-- 文字区域显示创作理念 (从图片替代) 由于无法动态抓取文本，用静态占位 -->
            <a-text id="modalText" value="点击画作 · 细节欣赏" color="#4a2a3a" align="center" width="5" font="helvetiker" size="0.18" position="0 -2.5 0.01"></a-text>
            <a-text value="点击任意处关闭" color="#a06a7a" align="center" width="4" font="helvetiker" size="0.12" position="0 -2.9 0.01"></a-text>
        </a-entity>

        <!-- 地面: 柔和粉 -->
        <a-plane width="30" height="30" rotation="-90 0 0" position="0 -0.8 0" 
                 material="color: #fad9e2; roughness: 0.8; metalness: 0.1"></a-plane>
        
        <!-- 装饰小圆点 / 温柔光晕 -->
        <a-circle radius="8" position="0 -0.7 -6" material="color: #ffd9e2; opacity: 0.2; side: double"></a-circle>

        <!-- 浮动花瓣效果 (简单) -->
        <a-entity position="-2 2 -5">
            <a-sphere radius="0.06" color="#ffb0c0" position="0 0 0" animation="property: position; to: 0 -1 0; loop: true; dur: 4000; easing: easeInOutQuad; dir: alternate"></a-sphere>
        </a-entity>
        <a-entity position="3 1.5 -4">
            <a-sphere radius="0.05" color="#ffc1d0" position="0 0 0" animation="property: position; to: 0 -0.8 0; loop: true; dur: 3500; easing: easeInOutQuad; dir: alternate; delay: 1000"></a-sphere>
        </a-entity>
        <a-entity position="-1 2.5 3">
            <a-sphere radius="0.07" color="#ffb8c6" position="0 0 0" animation="property: position; to: 0 -1.5 0; loop: true; dur: 5000; easing: easeInOutQuad; dir: alternate; delay: 500"></a-sphere>
        </a-entity>

    </a-scene>

    <script>
        // 移除加载提示
        window.addEventListener('load', function() {
            const loading = document.getElementById('loading');
            if (loading) loading.style.opacity = '0';
            setTimeout(() => { if(loading) loading.style.display = 'none'; }, 800);
        });

        // 点击画框时更新modal图片和文本 (由于没有具体文本对应, 用图片名简单示意)
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImage');
        const modalText = document.getElementById('modalText');

        // 监听所有 .clickable 点击事件 (通过事件代理)
        document.querySelector('a-scene').addEventListener('click', function(evt) {
            const target = evt.target;
            if (target.classList && target.classList.contains('clickable')) {
                // 获取图片源
                const imgEl = target.querySelector('a-image');
                if (imgEl) {
                    const src = imgEl.getAttribute('src');
                    if (src && modal) {
                        modalImg.setAttribute('src', src);
                        // 从文件名提取简单标题
                        const name = src.replace('.jpg','').replace('图片','作品');
                        modalText.setAttribute('value', `✨ ${name} · 工笔雅韵 ✨`);
                        modal.setAttribute('visible', true);
                    }
                }
            }
        });

        // 手动修正modal关闭 (点击modal本身关闭已在event-set中)
        // 额外支持点击背景关闭
    </script>
</body>
</html>
