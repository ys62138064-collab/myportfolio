<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>郑雨丝 · VR 艺术展厅</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', '华文细黑', 'Microsoft YaHei', sans-serif;
      background-color: #0a080c;
    }
    #info {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #cccbc8;
      font-size: 14px;
      letter-spacing: 2px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(6px);
      padding: 8px 16px;
      width: fit-content;
      margin: 0 auto;
      border-radius: 60px;
      border: 1px solid rgba(255,215,150,0.15);
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }
    #info span {
      opacity: 0.7;
      font-weight: 300;
    }
    @media (max-width: 600px) {
      #info { font-size: 11px; padding: 4px 14px; bottom: 12px; }
    }
    /* 加载提示 (很快消失) */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a080c;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4c9ba;
      font-size: 18px;
      letter-spacing: 4px;
      z-index: 999;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }
    #loading.hide {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="loading">✦ 加载艺术空间 ✦</div>
  <div id="info">🖱️ 拖拽旋转 · 滚轮缩放 · 郑雨丝  <span>「 3D 沉浸式画廊 」</span></div>

  <!-- 引入 Three.js 核心库及扩展 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- 1. 场景 / 相机 / 渲染器 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a080c); // 深空色

    // 添加一些氛围雾
    scene.fog = new THREE.FogExp2(0x0a080c, 0.008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 12);
    camera.lookAt(0, 0, 0);

    // WebGL 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // CSS2D 渲染器 (用于文字标签)
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none'; // 让文字不阻挡鼠标操作
    document.body.appendChild(labelRenderer.domElement);

    // --- 2. 控制器 (VR 式自由漫游) ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.6;
    controls.zoomSpeed = 1.0;
    controls.panSpeed = 0.5;
    controls.screenSpacePanning = true;
    controls.maxPolarAngle = Math.PI / 2.2; // 限制角度，避免看到背面空白
    controls.minDistance = 3;
    controls.maxDistance = 20;
    controls.target.set(0, 0.5, 0);

    // --- 3. 灯光 ---
    // 环境光
    const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambientLight);

    // 主光源 - 产生立体感
    const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    mainLight.position.set(4, 8, 6);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);

    // 辅助背光
    const backLight = new THREE.DirectionalLight(0x99bbff, 0.5);
    backLight.position.set(-3, 1, -6);
    scene.add(backLight);

    // 补光
    const fillLight = new THREE.PointLight(0xffaa66, 0.4);
    fillLight.position.set(0, 2, 4);
    scene.add(fillLight);

    // 氛围底部光
    const bottomLight = new THREE.PointLight(0x4466aa, 0.3);
    bottomLight.position.set(0, -2, 2);
    scene.add(bottomLight);

    // 点缀一些微弱的闪烁光点 (装饰)
    const starLight = new THREE.PointLight(0xffaa88, 0.2);
    starLight.position.set(3, 1, -3);
    scene.add(starLight);

    // --- 4. 地面 / 展台效果 (圆形光晕) ---
    const floorGeometry = new THREE.CircleGeometry(8, 32);
    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x1a1620,
      roughness: 0.9,
      metalness: 0.1,
      transparent: true,
      opacity: 0.6,
      side: THREE.DoubleSide
    });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.65;
    floor.receiveShadow = true;
    scene.add(floor);

    // 辅助网格线 (极淡)
    const gridHelper = new THREE.GridHelper(12, 12, 0x887766, 0x443a33);
    gridHelper.position.y = -0.6;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.15;
    scene.add(gridHelper);

    // 一些漂浮粒子 (营造VR氛围)
    const particleCount = 400;
    const particlesGeo = new THREE.BufferGeometry();
    const particlesPos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      particlesPos[i] = (Math.random() - 0.5) * 30;
      particlesPos[i+1] = (Math.random() - 0.5) * 15;
      particlesPos[i+2] = (Math.random() - 0.5) * 20 - 5;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPos, 3));
    const particlesMat = new THREE.PointsMaterial({
      color: 0xb8a08a,
      size: 0.04,
      transparent: true,
      opacity: 0.3,
      blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particles);

    // --- 5. 核心: 创建画作卡片 (带图片 + 文字标签) ---
    // 定义所有作品数据 (图片路径, 标题, 简介)
    const artworks = [
      { img: '图片1.jpg', title: '悠然自得', desc: '2025 · 宣纸 38x38cm' },
      { img: '图片2.jpg', title: '镜中蜃楼', desc: '2025 · 卷轴 42x79cm' },
      { img: '图片3.jpg', title: '香飘四溢', desc: '2025 · 宣纸 38x38cm' },
      { img: '图片4.jpg', title: '懒惰猫猫', desc: '2025 · 42x29.7cm' },
      { img: '图片5.jpg', title: '旋转木马', desc: '2025 · 卷轴 80x31cm' },
      { img: '图片6.jpg', title: '丹顶鹤寿', desc: '2025 · 宣纸 33x28cm' },
      { img: '图片7.jpg', title: '鱼跃团圆', desc: '2025 · 宣纸 36.5x27cm' },
      { img: '图片8.jpg', title: '栀子锦簇', desc: '2025 · 宣纸 33.5x27.5cm' },
      { img: '图片9.jpg', title: '凤冠霞帔', desc: '2025 · 宣纸 42x29.7cm' },
      { img: '图片10.jpg', title: '聘婷袅娜·女冠', desc: '2025 · 卷轴 34x80cm' },
      { img: '图片11.jpg', title: '玉簪', desc: '2025 · 宣纸 38x38cm' },
      { img: '图片12.jpg', title: '清馬騰飛', desc: '2025 · 宣纸 38x38cm' },
      { img: '图片13.jpg', title: '郑雨丝 · 艺术家', desc: '暨南大学 · 港大进修 · 教大研究生' }
    ];

    // 存储所有卡片组，用于动画
    const cardMeshes = [];

    // 排列参数: 弧形布局
    const radius = 5.8;
    const startAngle = -1.2;
    const angleStep = (2.4) / (artworks.length - 1);

    artworks.forEach((item, index) => {
      // 计算位置 (弧形)
      const angle = startAngle + index * angleStep;
      const x = Math.sin(angle) * radius;
      const z = Math.cos(angle) * radius - 1.5; // 稍微拉近
      const y = 0.2 + Math.sin(angle * 1.5) * 0.3; // 轻微起伏

      // ---- 创建画框 (3D 物体) ----
      const frameWidth = 2.0;
      const frameHeight = 2.2;
      const depth = 0.12;

      // 画板 (承载图片)
      const canvasMat = new THREE.MeshStandardMaterial({
        color: 0x2a2428,
        roughness: 0.6,
        metalness: 0.1,
        side: THREE.DoubleSide
      });
      const canvasGeo = new THREE.BoxGeometry(frameWidth, frameHeight, depth);
      const canvas = new THREE.Mesh(canvasGeo, canvasMat);
      canvas.castShadow = true;
      canvas.receiveShadow = true;
      canvas.position.set(x, y, z);

      // 加载图片纹理
      const textureLoader = new THREE.TextureLoader();
      const imgUrl = item.img;
      // 为了让纹理加载时显示占位，先给一个灰色，但直接异步加载
      const placeholderMat = new THREE.MeshStandardMaterial({
        color: 0x3a3038,
        roughness: 0.7,
        metalness: 0.1,
      });
      const imgMesh = new THREE.Mesh(new THREE.PlaneGeometry(frameWidth * 0.85, frameHeight * 0.85), placeholderMat);
      imgMesh.position.set(x, y, z + depth/2 + 0.005);
      imgMesh.castShadow = false;
      imgMesh.receiveShadow = false;

      // 加载纹理
      textureLoader.load(imgUrl, (texture) => {
        // 调整纹理映射
        texture.minFilter = THREE.LinearFilter;
        imgMesh.material = new THREE.MeshStandardMaterial({
          map: texture,
          roughness: 0.3,
          metalness: 0.05,
          side: THREE.DoubleSide,
        });
        imgMesh.material.needsUpdate = true;
      }, undefined, () => {
        // 加载失败用占位颜色
        imgMesh.material.color.setHex(0x554a50);
      });

      scene.add(canvas);
      scene.add(imgMesh);

      // ---- 添加外发光边框 (装饰) ----
      const edgeMat = new THREE.MeshStandardMaterial({
        color: 0xb8a28a,
        emissive: 0x332a24,
        roughness: 0.4,
        metalness: 0.6,
        transparent: true,
        opacity: 0.3
      });
      const edgeGeo = new THREE.BoxGeometry(frameWidth + 0.1, frameHeight + 0.1, 0.04);
      const edge = new THREE.Mesh(edgeGeo, edgeMat);
      edge.position.set(x, y, z + depth/2 + 0.02);
      scene.add(edge);

      // ---- 创建 CSS2D 标签 (标题 + 简介) ----
      const labelDiv = document.createElement('div');
      labelDiv.style.color = '#ede7dd';
      labelDiv.style.fontFamily = '"Segoe UI", "华文细黑", sans-serif';
      labelDiv.style.textAlign = 'center';
      labelDiv.style.textShadow = '0 2px 20px rgba(0,0,0,0.9), 0 0 12px rgba(0,0,0,0.7)';
      labelDiv.style.background = 'rgba(10, 8, 12, 0.55)';
      labelDiv.style.backdropFilter = 'blur(6px)';
      labelDiv.style.padding = '6px 16px 8px 16px';
      labelDiv.style.borderRadius = '30px';
      labelDiv.style.border = '1px solid rgba(200, 170, 140, 0.2)';
      labelDiv.style.pointerEvents = 'none';
      labelDiv.style.transition = 'all 0.2s';
      labelDiv.style.maxWidth = '200px';
      
      const titleSpan = document.createElement('div');
      titleSpan.style.fontSize = '18px';
      titleSpan.style.fontWeight = '600';
      titleSpan.style.letterSpacing = '2px';
      titleSpan.style.color = '#f3e7d6';
      titleSpan.textContent = item.title;
      
      const descSpan = document.createElement('div');
      descSpan.style.fontSize = '12px';
      descSpan.style.fontWeight = '300';
      descSpan.style.color = '#bfaa92';
      descSpan.style.marginTop = '2px';
      descSpan.style.letterSpacing = '0.5px';
      descSpan.textContent = item.desc;
      
      labelDiv.appendChild(titleSpan);
      labelDiv.appendChild(descSpan);
      
      const label = new CSS2DObject(labelDiv);
      // 标签放在画框下方偏上一点
      label.position.set(x, y - frameHeight/2 - 0.35, z);
      scene.add(label);

      // 存储以便后续动画 (可做呼吸效果)
      cardMeshes.push({ canvas, imgMesh, edge, label, baseY: y, phase: index * 0.5 });
    });

    // --- 6. 添加中心装饰 (艺术家名字 3D 悬浮) ---
    const centerLabelDiv = document.createElement('div');
    centerLabelDiv.style.color = '#dccfc0';
    centerLabelDiv.style.fontSize = '26px';
    centerLabelDiv.style.fontWeight = '200';
    centerLabelDiv.style.letterSpacing = '12px';
    centerLabelDiv.style.textShadow = '0 0 40px rgba(180, 130, 80, 0.3)';
    centerLabelDiv.style.background = 'rgba(10, 8, 12, 0.3)';
    centerLabelDiv.style.backdropFilter = 'blur(4px)';
    centerLabelDiv.style.padding = '10px 30px';
    centerLabelDiv.style.borderRadius = '60px';
    centerLabelDiv.style.border = '1px solid rgba(200, 170, 140, 0.1)';
    centerLabelDiv.textContent = '✦ 郑雨丝 ✦';
    const centerLabel = new CSS2DObject(centerLabelDiv);
    centerLabel.position.set(0, 1.8, -2.5);
    scene.add(centerLabel);

    // 增加一些环境小立柱 (装饰)
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x332c30, emissive: 0x1a1418, roughness: 0.8, metalness: 0.2 });
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const r = 6.2;
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.15, 0.4, 6), pillarMat);
      pillar.position.set(Math.sin(angle) * r, -0.5, Math.cos(angle) * r - 1.0);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      scene.add(pillar);
    }

    // 微光晕
    const glowLight = new THREE.PointLight(0x885533, 0.2);
    glowLight.position.set(0, 0, -1);
    scene.add(glowLight);

    // --- 7. 动画循环 ---
    let clock = new THREE.Clock();

    function animate() {
      const delta = clock.getDelta();
      const elapsedTime = performance.now() * 0.001; // seconds

      // 卡片微微浮动 (VR 呼吸感)
      cardMeshes.forEach((item, idx) => {
        const offsetY = Math.sin(elapsedTime * 0.5 + item.phase) * 0.03;
        const newY = item.baseY + offsetY;
        item.canvas.position.y = newY;
        item.imgMesh.position.y = newY;
        item.edge.position.y = newY;
        item.label.position.y = newY - 0.08; // 标签跟随但略不同
      });

      // 粒子缓慢旋转
      particles.rotation.y += 0.0001;

      // 控制更新
      controls.update();

      // 渲染
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);

      requestAnimationFrame(animate);
    }

    animate();

    // --- 8. 窗口自适应 ---
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }

    // 隐藏加载提示
    setTimeout(() => {
      document.getElementById('loading').classList.add('hide');
    }, 600);

    // 处理图片加载失败时，保持界面 (已经在纹理加载中处理)
    console.log('✨ 郑雨丝 VR 展厅已启动 | 拖拽旋转/滚轮缩放');
  </script>
</body>
</html>
